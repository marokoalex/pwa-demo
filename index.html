<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>My First PWA</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#1976d2" />
  <script type="module" src="https://unpkg.com/@fluentui/web-components"></script>
</head>
<body>
<h1>My Fluent Experiment</h1>

  <fluent-card style="padding: 20px; width: 300px;">
      <h2>PWA WS Client</h2>
      <fluent-text-field id="ipInput" placeholder="Enter IP" value="127.0.0.1"></fluent-text-field>
      <fluent-text-field id="portInput" placeholder="Enter Port" value="5618"></fluent-text-field>
      <fluent-button appearance="accent" id="connectBtn">Connect</fluent-button>
      <fluent-checkbox>Accept Terms</fluent-checkbox>
  </fluent-card>

  <!-- Log output -->
  <div id="log"></div>

  <script>

    let socket = null;
    const logDiv = document.getElementById('log');

    function log(message) {
      logDiv.textContent += message + '\n';
      logDiv.scrollTop = logDiv.scrollHeight;
    }

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js")
        .then(reg => log('SW registered', reg))
        .catch(err => error('SW registration failed', err));
    }


    
    document.getElementById('connectBtn').addEventListener('click', () => {
    const ip = document.getElementById('ipInput').value.trim();
    const port = document.getElementById('portInput').value.trim();

    if (!ip || !port) {
      log('IP or port cannot be empty');
      return;
    }

    const wsUrl = `ws://${ip}:${port}`;
    log(`Connecting to ${wsUrl} ...`);

    // Close existing connection if any
    if (socket && socket.readyState === WebSocket.OPEN) {
      socket.close();
      log('Closed previous connection');
    }

    socket = new WebSocket(wsUrl);

    socket.onopen = () => {
      log('WebSocket connected');
      // Example: send initial message
      socket.send('hi there');
      log('Sent: hi there');
    };

    socket.onmessage = (event) => {
      log(`Message from server: ${event.data}`);
    };

    socket.onerror = (error) => {
      log(`WebSocket error: ${error}`);
    };

    socket.onclose = () => {
      log('WebSocket closed');
    };
  });
    
  </script>
</body>

</html>
