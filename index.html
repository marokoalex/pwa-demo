<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>My First PWA</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#1976d2" />
  <script type="module" src="https://unpkg.com/@fluentui/web-components"></script>
</head>
<body>
<h1>My Fluent Experiment</h1>

  <fluent-card style="padding: 20px; width: 300px;">
      <h2>Hello World</h2>
      <fluent-button appearance="accent">Click Me</fluent-button>
      <fluent-checkbox>Accept Terms</fluent-checkbox>
  </fluent-card>

  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js");
    }

    const socket = new WebSocket('ws://localhost:5618');
  
    socket.onopen = () => {
      console.log('WebSocket connected');
    };
  
    socket.onmessage = (event) => {
      console.log('Message from server:', event.data);
    };
  
    socket.onerror = (error) => {
      console.error('WebSocket error:', error);
    };
  
    socket.onclose = () => {
      console.log('WebSocket closed');
    };
      
    // 2️⃣ Attach event listener to Fluent Button
    const fluentButton = document.querySelector('fluent-button');
  
    fluentButton.addEventListener('click', () => {
      if (socket.readyState === WebSocket.OPEN) {
        socket.send('hi there');
        console.log('Sent: hi there');
      } else {
        console.warn('WebSocket not connected yet');
      }
  });
    
  </script>
</body>

</html>
